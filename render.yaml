services:
  - type: web
    name: hust-course-advisor
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: hust_course_advisor_live
      - key: GEMINI_API_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: RAG_SYNC_ON_STARTUP
        value: auto
      - key: RAG_VECTOR_SEARCH
        value: "off"
