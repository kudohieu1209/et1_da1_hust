<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- HUST Crimson Gradient -->
    <linearGradient id="hustRedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21A36"/>
      <stop offset="100%" stop-color="#960B1C"/>
    </linearGradient>
    
    <!-- Gold AI Glow Gradient -->
    <linearGradient id="hustGoldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#F6C400"/>
      <stop offset="100%" stop-color="#D9A300"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="iconDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Base (Apple Style) -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#hustRedBg)"/>
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>

  <!-- Academic Open Book with High Contrast -->
  <g filter="url(#iconDepth)">
    <!-- Book Pages (Pure White for Maximum Contrast at Small Sizes) -->
    <path d="M11 18.2C15.8 16.4 20.6 16.6 24 18.5C27.4 16.6 32.2 16.4 37 18.2V29.8C32.2 28 27.4 28.2 24 30.1C20.6 28.2 15.8 28 11 29.8V18.2Z" 
          fill="#FFFFFF"/>
    
    <!-- Central Book Spine Divider -->
    <path d="M24 19V30.5" stroke="#E21A36" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Subtle Golden Bookmark Ribbon under the book -->
    <path d="M22.8 30L24 34L25.2 30" stroke="#F6C400" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Primary 4-point AI Sparkle (Golden Radiance) -->
  <path d="M34 6.5C34 10.2 36.6 12.8 40.3 12.8C36.6 12.8 34 15.4 34 19.1C34 15.4 31.4 12.8 27.7 12.8C31.4 12.8 34 10.2 34 6.5Z" 
        fill="url(#hustGoldGlow)"/>

  <!-- Secondary Mini Sparkle -->
  <path d="M26.5 5.5C26.5 7 27.5 8 29 8C27.5 8 26.5 9 26.5 10.5C26.5 9 25.5 8 24 8C25.5 8 26.5 7 26.5 5.5Z" 
        fill="#FFE885"/>
</svg>
